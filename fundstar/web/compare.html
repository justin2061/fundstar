<details class="guide" open><summary>怎麼看這張表</summary>
<p>每一欄是一個級別。報酬、波動、回撤都由官方淨值與配息計算；資料期間太短的項目會顯示「資料不足」。
幣別不同時，報酬包含匯率漲跌，不能直接相比。「漲跌相關係數」介於 -1 到 1，越接近 1 表示過去每天漲跌越同步；這只描述過去走勢，不代表未來。</p></details>
